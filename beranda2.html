<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Pembelajaran</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100%; height:100%; overflow:hidden;
            font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
            display:flex; align-items:center; justify-content:center;
            background:#0b0e1a;
        }
        /* fallback gradien */
        #bgLayer {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:0;
            background: linear-gradient(-45deg, #1a1a3e, #2a2f6e, #1e2a5a, #0f1a3a);
            background-size:400% 400%;
            animation:gradienMobil 12s ease infinite;
        }
        @keyframes gradienMobil {
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }
        /* GIF background – GIF sudah portrait (332x590), jadi TIDAK perlu dirotasi.
           object-fit:cover akan mengisi penuh layar tanpa terpotong aneh & tanpa blur zoom berlebih. */
        #gifBg {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:1;
            object-fit:cover;
            object-position:center center;
            pointer-events:none;
        }
        /* kontainer utama: flex kolom, mulai dari atas supaya posisi presisi & mudah diatur */
        .main-container {
            position:relative; z-index:2;
            display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
            width:100%; height:100%;
            padding:15vh 16px 10px;   /* jarak dari atas layar — perbesar utk turunkan, perkecil utk naikkan */
        }
        /* KARTU TEKS UTAMA – DIPERBESAR & DINAIKKAN */
        .glass-card {
            width:96%; max-width:620px;
            padding:56px 36px 48px;      /* lebih besar, mengikuti teks judul yang diperbesar */
            background:rgba(255,255,255,0.10);
            backdrop-filter:blur(28px) saturate(1.5);
            -webkit-backdrop-filter:blur(28px) saturate(1.5);
            border-radius:44px;
            border:1px solid rgba(255,255,255,0.20);
            box-shadow:0 16px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.30);
            text-align:center;
            color:#ffffff;
            animation:floatCard 5s ease-in-out infinite;
            margin-bottom:14px;
        }
        @keyframes floatCard {
            0%,100%{transform:translateY(0px);}
            50%{transform:translateY(-6px);}
        }
        /* TEKS UTAMA – "MEDIA PEMBELAJARAN" diperbesar agar mudah dibaca siswa */
        .line-1 {
            font-size:clamp(24px,5vw,36px);
            font-weight:700; letter-spacing:2.5px; text-transform:uppercase;
            opacity:0.95; margin-bottom:12px;
            text-shadow:0 1px 8px rgba(0,0,0,0.25);
            white-space:nowrap;
        }
        .line-2 {
            white-space:nowrap;
            font-weight:700; line-height:1.2;
            margin:12px 0 10px;
            text-shadow:0 3px 16px rgba(0,0,0,0.35);
            letter-spacing:-0.3px;
            font-size:clamp(30px,6.5vw,48px);
        }
        .line-3 {
            font-size:clamp(18px,3.2vw,26px);
            font-weight:500; opacity:0.85;
            letter-spacing:1.5px; margin-top:4px;
            text-shadow:0 1px 6px rgba(0,0,0,0.20);
            white-space:nowrap;
        }

        /* KOTAK KAMPUS – lebih rapi dan proporsional */
        .campus-box {
            width:94%; max-width:540px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(20px) saturate(1.4);
            -webkit-backdrop-filter:blur(20px) saturate(1.4);
            border-radius:32px;
            border:1px solid rgba(255,255,255,0.15);
            padding:14px 20px;
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:16px;
            box-shadow:0 6px 24px rgba(0,0,0,0.2);
            transition:transform 0.2s ease;
            color:#ffffff;
        }
        .campus-box:active { transform:scale(0.97); }

        .campus-box img {
            width:52px; height:52px;
            object-fit:contain;
            border-radius:14px;
            background:rgba(255,255,255,0.05);
            flex-shrink:0;
        }
        .campus-box .campus-text {
            font-size:clamp(16px,2.2vw,22px);
            font-weight:600;
            letter-spacing:0.5px;
            text-shadow:0 1px 4px rgba(0,0,0,0.2);
            line-height:1.3;
            text-align:left;
        }
        .campus-box .campus-text small {
            display:block;
            font-size:clamp(12px,1.5vw,17px);
            font-weight:300;
            opacity:0.75;
            margin-top:2px;
        }

        /* TOMBOL MULAI – diperbesar */
        .btn-mulai {
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(20px) saturate(1.5);
            -webkit-backdrop-filter:blur(20px) saturate(1.5);
            border:1px solid rgba(255,255,255,0.25);
            border-radius:60px;
            padding:22px 60px;
            font-size:clamp(24px,3.8vw,38px);
            font-weight:700;
            color:#ffffff;
            text-shadow:0 2px 12px rgba(0,0,0,0.4);
            box-shadow:0 10px 40px rgba(0,0,0,0.35);
            cursor:pointer;
            transition:all 0.25s ease;
            letter-spacing:3px;
            min-width:240px;
            text-align:center;
            margin-top:8px;
        }
        .btn-mulai:active {
            transform:scale(0.93);
            background:rgba(255,255,255,0.25);
            box-shadow:0 4px 20px rgba(0,0,0,0.5);
        }

        /* efek kilau & glow untuk kartu utama */
        .glass-card::before {
            content:'';
            position:absolute; top:-1px;left:-1px;right:-1px;bottom:-1px;
            border-radius:inherit;
            background:linear-gradient(135deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.03) 40%, rgba(255,255,255,0.08) 100%);
            pointer-events:none; z-index:-1;
            mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite:exclude;
            -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor;
            padding:1.5px;
        }
        .glass-card::after {
            content:'';
            position:absolute; top:-8px;left:-8px;right:-8px;bottom:-8px;
            border-radius:48px;
            background:radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 70%);
            pointer-events:none; z-index:-2;
            filter:blur(12px);
        }

        /* RESPONSIF – untuk layar yang lebih kecil */
        @media (max-width:600px) {
            .main-container { padding-top:13vh; }
            .glass-card { padding:42px 24px 36px; max-width:96%; }
            .line-1 { font-size:clamp(20px,4.6vw,28px); }
            .line-2 { font-size:clamp(22px,5.5vw,34px); }
            .line-3 { font-size:clamp(14px,2.8vw,20px); }
            .campus-box { width:96%; padding:12px 16px; gap:14px; }
            .campus-box img { width:44px; height:44px; }
            .campus-box .campus-text { font-size:clamp(14px,2vw,18px); }
            .campus-box .campus-text small { font-size:clamp(11px,1.4vw,14px); }
            .btn-mulai { padding:18px 40px; font-size:clamp(20px,3.2vw,30px); min-width:180px; }
        }
        @media (max-width:420px) {
            .main-container { padding-top:12vh; }
            .glass-card { padding:32px 18px 28px; border-radius:34px; }
            .line-1 { font-size:clamp(17px,4vw,22px); letter-spacing:1.8px; }
            .line-2 { font-size:clamp(18px,4.8vw,26px); }
            .line-3 { font-size:clamp(12px,2.4vw,16px); }
            .campus-box { border-radius:26px; padding:10px 14px; gap:12px; }
            .campus-box img { width:38px; height:38px; }
            .campus-box .campus-text { font-size:clamp(12px,1.8vw,15px); }
            .campus-box .campus-text small { font-size:clamp(10px,1.2vw,12px); }
            .btn-mulai { padding:14px 28px; font-size:clamp(16px,2.8vw,22px); min-width:140px; }
        }
    </style>
</head>
<body>

    <!-- GRADIEN FALLBACK -->
    <div id="bgLayer"></div>

    <!-- GIF BACKGROUND (rotasi 90°) -->
    <img id="gifBg" src="" alt="Background">

    <!-- KONTEN UTAMA -->
    <div class="main-container">

        <!-- KARTU TEKS UTAMA (dinaikkan & diperbesar) -->
        <div class="glass-card">
            <div class="line-1">Media Pembelajaran</div>
            <div class="line-2">Administrasi Infrastruktur Jaringan</div>
            <div class="line-3">Semester II XI TKJ</div>
        </div>

        <!-- KOTAK KAMPUS 1: STKIP Al Maksum -->
        <div class="campus-box">
            <img src="1.png" alt="Logo STKIP Al Maksum">
            <div class="campus-text">
                STKIP Al Maksum
                <small>Jl. Sei Batang Serangan No 4 Stabat-Langkat</small>
            </div>
        </div>

        <!-- KOTAK KAMPUS 2: SMK Swasta Nusa Indah -->
        <div class="campus-box">
            <img src="2.png" alt="Logo SMK Nusa Indah">
            <div class="campus-text">
                SMK Swasta Nusa Indah
                <small>Trans Blok M, Telaga Jernih, Secanggang, Langkat</small>
            </div>
        </div>

        <!-- TOMBOL MULAI -->
        <button class="btn-mulai" onclick="mulai()">MULAI</button>
    </div>

    <script>
        // =====================================================
        //  SETTING GIF – ganti nama file jika berbeda
        // =====================================================
        (function() {
            const GIF_FILE = 'networkk.gif';   // ← sesuaikan dengan nama file GIF Anda

            const gif = document.getElementById('gifBg');
            const timestamp = new Date().getTime();
            gif.src = GIF_FILE + '?t=' + timestamp;

            gif.onerror = function() {
                this.style.display = 'none';
            };
            gif.onload = function() {
                document.getElementById('bgLayer').style.animation = 'none';
            };
        })();

        // =====================================================
        //  FUNGSI TOMBOL MULAI – kirim string ke App Inventor
        // =====================================================
        function mulai() {
            if (window.AppInventor) {
                window.AppInventor.setWebViewString("MULAI");
            } else {
                alert("Tombol MULAI ditekan (simulasi)");
            }
        }
    </script>
</body>
</html>
