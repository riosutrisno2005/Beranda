<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Pembelajaran</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e1a;
        }

        /* === LAPISAN BACKGROUND (GIF) === */
        #bgLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(-45deg, #1a1a3e, #2a2f6e, #1e2a5a, #0f1a3a);
            background-size: 400% 400%;
            animation: gradienMobil 12s ease infinite;
        }
        @keyframes gradienMobil {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* === KARTU GLASS === */
        .glass-card {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 420px;          /* lebih sempit agar teks panjang tidak kelewat */
            padding: 24px 16px 20px;   /* padding horizontal lebih kecil */
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
            text-align: center;
            color: #ffffff;
            animation: floatCard 4.5s ease-in-out infinite;
        }
        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* === TEKS === */
        .line-1 {
            font-size: clamp(10px, 2.2vw, 16px);
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 2px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.2);
            white-space: nowrap;
        }
        .line-2 {
            white-space: nowrap;
            font-weight: 700;
            line-height: 1.2;
            margin: 4px 0 4px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.3);
            letter-spacing: -0.2px;
            /* Ukuran font lebih kecil dan responsif */
            font-size: clamp(14px, 3.8vw, 28px);
        }
        .line-3 {
            font-size: clamp(10px, 2.2vw, 16px);
            font-weight: 400;
            opacity: 0.75;
            letter-spacing: 1px;
            margin-top: 2px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.15);
            white-space: nowrap;
        }

        /* === MEDIA QUERY UNTUK LAYAR SANGAT SEMPIT === */
        @media (max-width: 480px) {
            .glass-card {
                padding: 16px 12px 14px;
                border-radius: 24px;
                max-width: 95%;
            }
            .line-2 {
                font-size: clamp(12px, 3.5vw, 20px);
            }
            .line-1, .line-3 {
                font-size: clamp(9px, 2vw, 12px);
            }
        }
        @media (max-width: 380px) {
            .glass-card {
                padding: 12px 8px 10px;
                border-radius: 18px;
            }
            .line-2 {
                font-size: clamp(10px, 3vw, 16px);
            }
            .line-1, .line-3 {
                font-size: clamp(8px, 1.8vw, 10px);
            }
        }

        /* efek kilau tepi */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.02) 60%, rgba(255,255,255,0.12) 100%);
            pointer-events: none;
            z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            padding: 1px;
        }
    </style>
</head>
<body>

    <div id="bgLayer"></div>

    <div class="glass-card">
        <div class="line-1">Media Pembelajaran</div>
        <div class="line-2">Administrasi Infrastruktur Jaringan</div>
        <div class="line-3">Semester II XI TKJ</div>
    </div>

    <script>
        // =====================================================
        //   SETTING GIF – Ganti nama file sesuai dengan GIF Anda
        // =====================================================
        const GIF_FILE = 'wallpaper.gif';   // ← ubah jika perlu

        const bg = document.getElementById('bgLayer');
        bg.style.background = `url("${GIF_FILE}") center/cover no-repeat`;
        bg.style.animation = 'none';
    </script>

</body>
</html>
