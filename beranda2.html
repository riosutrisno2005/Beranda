<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Pembelajaran</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100%; height:100%; overflow:hidden;
            font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
            display:flex; align-items:center; justify-content:center;
            background:#0b0e1a;
        }
        /* fallback gradien */
        #bgLayer {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:0;
            background: linear-gradient(-45deg, #1a1a3e, #2a2f6e, #1e2a5a, #0f1a3a);
            background-size:400% 400%;
            animation:gradienMobil 12s ease infinite;
        }
        @keyframes gradienMobil {
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }
        /* GIF background – rotasi 90°, tidak terlalu zoom */
        #gifBg {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:1;
            object-fit:cover;
            pointer-events:none;
            transform: rotate(90deg) scale(1.3);
            transform-origin: center center;
        }
        /* kontainer utama: flex kolom, tengah */
        .main-container {
            position:relative; z-index:2;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            width:100%; height:100%;
            padding:16px 20px;
        }
        /* KARTU TEKS UTAMA – diperbesar & dinaikkan */
        .glass-card {
            width:92%; max-width:560px;
            padding:44px 32px 38px;      /* lebih besar */
            background:rgba(255,255,255,0.10);
            backdrop-filter:blur(28px) saturate(1.5);
            -webkit-backdrop-filter:blur(28px) saturate(1.5);
            border-radius:40px;
            border:1px solid rgba(255,255,255,0.20);
            box-shadow:0 16px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.30);
            text-align:center;
            color:#ffffff;
            animation:floatCard 5s ease-in-out infinite;
            margin-top:-20px;            /* naikkan sedikit */
            margin-bottom:16px;
        }
        @keyframes floatCard {
            0%,100%{transform:translateY(0px);}
            50%{transform:translateY(-6px);}
        }
        /* TEKS UTAMA – diperbesar */
        .line-1 {
            font-size:clamp(16px,3vw,24px);
            font-weight:500; letter-spacing:3px; text-transform:uppercase;
            opacity:0.85; margin-bottom:6px;
            text-shadow:0 1px 8px rgba(0,0,0,0.25);
            white-space:nowrap;
        }
        .line-2 {
            white-space:nowrap;
            font-weight:700; line-height:1.2;
            margin:10px 0 8px;
            text-shadow:0 3px 16px rgba(0,0,0,0.35);
            letter-spacing:-0.3px;
            font-size:clamp(26px,6vw,44px);
        }
        .line-3 {
            font-size:clamp(16px,3vw,24px);
            font-weight:400; opacity:0.80;
            letter-spacing:1.5px; margin-top:4px;
            text-shadow:0 1px 6px rgba(0,0,0,0.20);
            white-space:nowrap;
        }

        /* KOTAK KAMPUS (dua buah) – glass style */
        .campus-box {
            width:88%; max-width:500px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(20px) saturate(1.4);
            -webkit-backdrop-filter:blur(20px) saturate(1.4);
            border-radius:30px;
            border:1px solid rgba(255,255,255,0.15);
            padding:12px 18px;
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:14px;
            box-shadow:0 6px 24px rgba(0,0,0,0.2);
            transition:transform 0.2s ease;
            color:#ffffff;
        }
        .campus-box:active { transform:scale(0.97); }

        .campus-box img {
            width:48px; height:48px;
            object-fit:contain;
            border-radius:12px;
            background:rgba(255,255,255,0.05);
            flex-shrink:0;
        }
        .campus-box .campus-text {
            font-size:clamp(14px,2vw,20px);
            font-weight:500;
            letter-spacing:0.5px;
            text-shadow:0 1px 4px rgba(0,0,0,0.2);
            line-height:1.3;
            text-align:left;
        }
        .campus-box .campus-text small {
            display:block;
            font-size:clamp(11px,1.4vw,16px);
            font-weight:300;
            opacity:0.7;
            margin-top:2px;
        }

        /* TOMBOL MULAI – diperbesar */
        .btn-mulai {
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(20px) saturate(1.5);
            -webkit-backdrop-filter:blur(20px) saturate(1.5);
            border:1px solid rgba(255,255,255,0.25);
            border-radius:60px;
            padding:20px 56px;          /* lebih besar */
            font-size:clamp(22px,3.5vw,34px);
            font-weight:700;
            color:#ffffff;
            text-shadow:0 2px 12px rgba(0,0,0,0.4);
            box-shadow:0 10px 40px rgba(0,0,0,0.35);
            cursor:pointer;
            transition:all 0.25s ease;
            letter-spacing:3px;
            min-width:220px;
            text-align:center;
            margin-top:6px;
        }
        .btn-mulai:active {
            transform:scale(0.93);
            background:rgba(255,255,255,0.25);
            box-shadow:0 4px 20px rgba(0,0,0,0.5);
        }

        /* efek kilau & glow untuk kartu utama */
        .glass-card::before {
            content:'';
            position:absolute; top:-1px;left:-1px;right:-1px;bottom:-1px;
            border-radius:inherit;
            background:linear-gradient(135deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.03) 40%, rgba(255,255,255,0.08) 100%);
            pointer-events:none; z-index:-1;
            mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite:exclude;
            -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor;
            padding:1.5px;
        }
        .glass-card::after {
            content:'';
            position:absolute; top:-8px;left:-8px;right:-8px;bottom:-8px;
            border-radius:48px;
            background:radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 70%);
            pointer-events:none; z-index:-2;
            filter:blur(12px);
        }

        /* RESPONSIF */
        @media (max-width:600px) {
            .glass-card { padding:32px 22px 26px; max-width:94%; margin-top:-10px; }
            .line-1 { font-size:clamp(13px,2.5vw,18px); }
            .line-2 { font-size:clamp(20px,5vw,32px); }
            .line-3 { font-size:clamp(13px,2.5vw,18px); }
            .campus-box { width:94%; padding:10px 14px; gap:12px; }
            .campus-box img { width:40px; height:40px; }
            .campus-box .campus-text { font-size:clamp(12px,1.8vw,17px); }
            .btn-mulai { padding:16px 36px; font-size:clamp(18px,3vw,28px); min-width:160px; }
        }
        @media (max-width:420px) {
            .glass-card { padding:24px 16px 20px; border-radius:32px; margin-top:-4px; }
            .line-1 { font-size:clamp(11px,2.2vw,14px); letter-spacing:2px; }
            .line-2 { font-size:clamp(17px,4.5vw,24px); }
            .line-3 { font-size:clamp(11px,2.2vw,14px); }
            .campus-box { border-radius:24px; padding:8px 12px; gap:10px; }
            .campus-box img { width:34px; height:34px; }
            .campus-box .campus-text { font-size:clamp(10px,1.6vw,14px); }
            .btn-mulai { padding:14px 28px; font-size:clamp(16px,2.8vw,22px); min-width:120px; }
        }
    </style>
</head>
<body>

    <!-- GRADIEN FALLBACK -->
    <div id="bgLayer"></div>

    <!-- GIF BACKGROUND (rotasi 90°) -->
    <img id="gifBg" src="" alt="Background">

    <!-- KONTEN UTAMA -->
    <div class="main-container">

        <!-- KARTU TEKS UTAMA -->
        <div class="glass-card">
            <div class="line-1">Media Pembelajaran</div>
            <div class="line-2">Administrasi Infrastruktur Jaringan</div>
            <div class="line-3">Semester II XI TKJ</div>
        </div>

        <!-- KOTAK KAMPUS 1: STKIP Al Maksum -->
        <div class="campus-box">
            <img src="1.png" alt="Logo STKIP Al Maksum">
            <div class="campus-text">
                STKIP Al Maksum
                <small>Sekolah Tinggi Keguruan dan Ilmu Pendidikan</small>
            </div>
        </div>

        <!-- KOTAK KAMPUS 2: SMK Swasta Nusa Indah -->
        <div class="campus-box">
            <img src="2.png" alt="Logo SMK Nusa Indah">
            <div class="campus-text">
                SMK Swasta Nusa Indah
                <small>Sekolah Menengah Kejuruan</small>
            </div>
        </div>

        <!-- TOMBOL MULAI -->
        <button class="btn-mulai" onclick="mulai()">MULAI</button>
    </div>

    <script>
        // =====================================================
        //  SETTING GIF – ganti nama file jika berbeda
        // =====================================================
        (function() {
            const GIF_FILE = 'networkk.gif';   // ← sesuaikan dengan nama file GIF Anda

            const gif = document.getElementById('gifBg');
            const timestamp = new Date().getTime();
            gif.src = GIF_FILE + '?t=' + timestamp;

            gif.onerror = function() {
                this.style.display = 'none';
            };
            gif.onload = function() {
                document.getElementById('bgLayer').style.animation = 'none';
            };
        })();

        // =====================================================
        //  FUNGSI TOMBOL MULAI – kirim string ke App Inventor
        // =====================================================
        function mulai() {
            if (window.AppInventor) {
                window.AppInventor.setWebViewString("MULAI");
            } else {
                // fallback untuk testing di browser
                alert("Tombol MULAI ditekan (simulasi)");
            }
        }
    </script>
</body>
</html>
