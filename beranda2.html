<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Pembelajaran</title>
    <style>
        /* reset dan fullscreen */
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100%; height:100%; overflow:hidden;
            font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
            display:flex; align-items:center; justify-content:center;
            background:#0b0e1a;
        }
        /* layer gradien fallback */
        #bgLayer {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:0;
            background: linear-gradient(-45deg, #1a1a3e, #2a2f6e, #1e2a5a, #0f1a3a);
            background-size:400% 400%;
            animation:gradienMobil 12s ease infinite;
        }
        @keyframes gradienMobil {
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }
        /* GIF background dengan rotasi 45deg */
        #gifBg {
            position:fixed; top:0; left:0; width:100%; height:100%; z-index:1;
            object-fit:cover;
            pointer-events:none;
            transform: rotate(45deg) scale(1.5); /* rotasi 45 derajat, diperbesar agar menutupi */
            transform-origin: center center;
        }
        /* kontainer utama: kartu + tombol */
        .main-container {
            position:relative; z-index:2;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            width:100%; height:100%;
            padding:20px;
        }
        /* KARTU GLASS (iOS style) */
        .glass-card {
            width:88%; max-width:520px;
            padding:36px 28px 32px;
            background:rgba(255,255,255,0.10);
            backdrop-filter:blur(28px) saturate(1.5);
            -webkit-backdrop-filter:blur(28px) saturate(1.5);
            border-radius:40px;
            border:1px solid rgba(255,255,255,0.20);
            box-shadow:0 16px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.30);
            text-align:center;
            color:#ffffff;
            animation:floatCard 5s ease-in-out infinite;
            margin-bottom:30px; /* jarak ke tombol */
        }
        @keyframes floatCard {
            0%,100%{transform:translateY(0px);}
            50%{transform:translateY(-8px);}
        }
        /* TEKS */
        .line-1 {
            font-size:clamp(14px,2.5vw,20px);
            font-weight:500; letter-spacing:3px; text-transform:uppercase;
            opacity:0.85; margin-bottom:4px;
            text-shadow:0 1px 8px rgba(0,0,0,0.25);
            white-space:nowrap;
        }
        .line-2 {
            white-space:nowrap;
            font-weight:700; line-height:1.2;
            margin:8px 0 6px;
            text-shadow:0 3px 16px rgba(0,0,0,0.35);
            letter-spacing:-0.3px;
            font-size:clamp(22px,5.5vw,40px);
        }
        .line-3 {
            font-size:clamp(14px,2.5vw,20px);
            font-weight:400; opacity:0.80;
            letter-spacing:1.5px; margin-top:4px;
            text-shadow:0 1px 6px rgba(0,0,0,0.20);
            white-space:nowrap;
        }
        /* TOMBOL MULAI */
        .btn-mulai {
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(20px) saturate(1.5);
            -webkit-backdrop-filter:blur(20px) saturate(1.5);
            border:1px solid rgba(255,255,255,0.25);
            border-radius:60px;
            padding:16px 48px;
            font-size:clamp(18px,3vw,28px);
            font-weight:600;
            color:#ffffff;
            text-shadow:0 2px 8px rgba(0,0,0,0.3);
            box-shadow:0 8px 32px rgba(0,0,0,0.3);
            cursor:pointer;
            transition:all 0.25s ease;
            letter-spacing:2px;
            min-width:200px;
            text-align:center;
        }
        .btn-mulai:active {
            transform:scale(0.94);
            background:rgba(255,255,255,0.25);
            box-shadow:0 4px 16px rgba(0,0,0,0.4);
        }
        /* efek kilau tepi untuk kartu (sama seperti sebelumnya) */
        .glass-card::before {
            content:'';
            position:absolute; top:-1px;left:-1px;right:-1px;bottom:-1px;
            border-radius:inherit;
            background:linear-gradient(135deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.03) 40%, rgba(255,255,255,0.08) 100%);
            pointer-events:none; z-index:-1;
            mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite:exclude;
            -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor;
            padding:1.5px;
        }
        .glass-card::after {
            content:'';
            position:absolute; top:-8px;left:-8px;right:-8px;bottom:-8px;
            border-radius:48px;
            background:radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 70%);
            pointer-events:none; z-index:-2;
            filter:blur(12px);
        }

        /* RESPONSIF */
        @media (max-width:600px) {
            .glass-card { padding:26px 20px 22px; max-width:90%; border-radius:32px; }
            .line-1 { font-size:clamp(12px,2.2vw,16px); }
            .line-2 { font-size:clamp(18px,4.8vw,30px); }
            .line-3 { font-size:clamp(12px,2.2vw,16px); }
            .btn-mulai { padding:14px 32px; font-size:clamp(16px,2.8vw,24px); min-width:160px; }
        }
        @media (max-width:420px) {
            .glass-card { padding:20px 14px 18px; border-radius:28px; max-width:94%; }
            .line-1 { font-size:clamp(10px,2vw,13px); letter-spacing:2px; }
            .line-2 { font-size:clamp(16px,4.2vw,24px); }
            .line-3 { font-size:clamp(10px,2vw,13px); letter-spacing:1px; }
            .btn-mulai { padding:12px 24px; font-size:clamp(14px,2.5vw,20px); min-width:140px; }
        }
        @media (max-width:360px) {
            .glass-card { padding:16px 10px 14px; border-radius:22px; }
            .line-2 { font-size:clamp(14px,3.8vw,20px); }
            .line-1, .line-3 { font-size:clamp(9px,1.8vw,11px); }
        }
    </style>
</head>
<body>

    <!-- FALLBACK GRADIEN -->
    <div id="bgLayer"></div>

    <!-- GIF BACKGROUND (dengan rotasi 45 derajat) -->
    <img id="gifBg" src="" alt="Background">

    <!-- KONTEN UTAMA (kartu + tombol) -->
    <div class="main-container">
        <!-- KARTU GLASS -->
        <div class="glass-card">
            <div class="line-1">Media Pembelajaran</div>
            <div class="line-2">Administrasi Infrastruktur Jaringan</div>
            <div class="line-3">Semester II XI TKJ</div>
        </div>

        <!-- TOMBOL MULAI -->
        <button class="btn-mulai" onclick="mulai()">MULAI</button>
    </div>

    <script>
        // =====================================================
        //  SETTING GIF – Ganti nama file jika berbeda
        // =====================================================
        (function() {
            const GIF_FILE = 'networkk.gif';   // ← sesuaikan dengan nama GIF Anda

            const gif = document.getElementById('gifBg');
            const timestamp = new Date().getTime();
            gif.src = GIF_FILE + '?t=' + timestamp;

            gif.onerror = function() {
                this.style.display = 'none';
            };
            gif.onload = function() {
                document.getElementById('bgLayer').style.animation = 'none';
            };
        })();

        // =====================================================
        //  FUNGSI UNTUK TOMBOL MULAI
        // =====================================================
        function mulai() {
            if (window.AppInventor) {
                window.AppInventor.setWebViewString("MULAI");
            } else {
                // fallback jika tidak di dalam App Inventor (misal di browser)
                alert("Tombol MULAI ditekan (simulasi)");
            }
        }
    </script>
</body>
</html>
