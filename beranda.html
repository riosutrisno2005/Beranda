<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Pembelajaran</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e1a;
        }

        /* LAPISAN GRADIEN (fallback jika GIF gagal) */
        #bgLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(-45deg, #1a1a3e, #2a2f6e, #1e2a5a, #0f1a3a);
            background-size: 400% 400%;
            animation: gradienMobil 12s ease infinite;
        }
        @keyframes gradienMobil {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* GAMBAR GIF (live wallpaper) */
        #gifBg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: cover;
            pointer-events: none;
        }

        /* KARTU GLASS (iOS style) */
        .glass-card {
            position: relative;
            z-index: 2;
            width: 88%;
            max-width: 520px;
            padding: 36px 28px 32px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.20);
            box-shadow: 0 16px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.30);
            text-align: center;
            color: #ffffff;
            animation: floatCard 5s ease-in-out infinite;
        }
        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* TEKS */
        .line-1 {
            font-size: clamp(14px, 2.5vw, 20px);
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.85;
            margin-bottom: 4px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.25);
            white-space: nowrap;
        }
        .line-2 {
            white-space: nowrap;
            font-weight: 700;
            line-height: 1.2;
            margin: 8px 0 6px;
            text-shadow: 0 3px 16px rgba(0,0,0,0.35);
            letter-spacing: -0.3px;
            font-size: clamp(22px, 5.5vw, 40px);
        }
        .line-3 {
            font-size: clamp(14px, 2.5vw, 20px);
            font-weight: 400;
            opacity: 0.80;
            letter-spacing: 1.5px;
            margin-top: 4px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.20);
            white-space: nowrap;
        }

        /* RESPONSIF */
        @media (max-width: 600px) {
            .glass-card {
                padding: 26px 20px 22px;
                max-width: 90%;
                border-radius: 32px;
            }
            .line-1 { font-size: clamp(12px, 2.2vw, 16px); }
            .line-2 { font-size: clamp(18px, 4.8vw, 30px); }
            .line-3 { font-size: clamp(12px, 2.2vw, 16px); }
        }
        @media (max-width: 420px) {
            .glass-card {
                padding: 20px 14px 18px;
                border-radius: 28px;
                max-width: 94%;
            }
            .line-1 { font-size: clamp(10px, 2vw, 13px); letter-spacing: 2px; }
            .line-2 { font-size: clamp(16px, 4.2vw, 24px); }
            .line-3 { font-size: clamp(10px, 2vw, 13px); letter-spacing: 1px; }
        }
        @media (max-width: 360px) {
            .glass-card {
                padding: 16px 10px 14px;
                border-radius: 22px;
            }
            .line-2 { font-size: clamp(14px, 3.8vw, 20px); }
            .line-1, .line-3 { font-size: clamp(9px, 1.8vw, 11px); }
        }

        /* EFEK KILAU TEPI */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.03) 40%, rgba(255,255,255,0.08) 100%);
            pointer-events: none;
            z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            padding: 1.5px;
        }
        /* GLOW HALUS DI SEKITAR KARTU */
        .glass-card::after {
            content: '';
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 48px;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: -2;
            filter: blur(12px);
        }
    </style>
</head>
<body>

    <!-- FALLBACK GRADIEN -->
    <div id="bgLayer"></div>

    <!-- GIF BACKGROUND (cache buster otomatis) -->
    <img id="gifBg" src="" alt="Background">

    <!-- KARTU GLASS -->
    <div class="glass-card">
        <div class="line-1">Media Pembelajaran</div>
        <div class="line-2">Administrasi Infrastruktur Jaringan</div>
        <div class="line-3">Semester II XI TKJ</div>
    </div>

    <script>
        (function() {
            // =====================================================
            //  SETTING GIF – Ganti nama file jika berbeda
            // =====================================================
            const GIF_FILE = 'networkk.gif';   // ← sesuaikan dengan nama GIF Anda

            const gif = document.getElementById('gifBg');

            // Tambahkan timestamp untuk menghindari cache
            const timestamp = new Date().getTime();
            gif.src = GIF_FILE + '?t=' + timestamp;

            // Jika gagal dimuat, sembunyikan dan gradien tetap tampil
            gif.onerror = function() {
                this.style.display = 'none';
            };

            // Jika sukses, matikan animasi gradien
            gif.onload = function() {
                document.getElementById('bgLayer').style.animation = 'none';
            };
        })();
    </script>
</body>
</html>
